<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigilo · Iscrizione</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0A;--muted:#48484A;--soft:#F2F2F7;--violet:#5B3DF5}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:0 20px 56px}
h1,p{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:600}
.field input,.field select{min-height:52px;border-radius:14px;border:1.5px solid #C7C7CC;padding:0 14px;font:inherit;background:#fff;color:var(--ink)}
.steps{display:flex;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.steps span{flex:1;padding-top:8px;border-top:3px solid #D1D1D6}
.steps .on{color:var(--ink);border-color:#000}
</style>
</head>
<body>
<div class="wrap">
<header style="display:flex;align-items:center;justify-content:space-between;padding:16px 0">
<a href="index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)">
<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#0A0A0A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h20v11c0 6-4.5 9.5-10 12-5.5-2.5-10-6-10-12z"/><path d="M11.5 11l4.5 9 4.5-9"/></svg>
<span style="font-weight:800;font-size:28px;letter-spacing:-0.04em">Vigilo</span>
</a>
<a href="index.html#prezzi" style="font-size:15px;font-weight:600;color:var(--violet)">Indietro</a>
</header>

<div class="steps" style="margin:16px 0 32px"><span class="on">1 · Piano</span><span class="on">2 · Iscrizione</span><span>3 · Pagamento</span></div>

<form onsubmit="event.preventDefault();document.getElementById('demo').hidden=false" style="display:flex;flex-direction:column;gap:20px">
<h1 style="font-weight:700;font-size:34px;letter-spacing:-0.035em;line-height:1.05">Crea il tuo account</h1>
<div style="background:var(--soft);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;gap:12px;font-size:17px;font-weight:700"><span id="selName">Vigilo Family</span><span id="selPrice">14,99 €/mese</span></div>
<div id="selSummary" style="font-size:15px;color:var(--muted)">4 account. +2 €/mese per account, fino a 4 in più.</div>
</div>
<div class="field"><label for="email">La tua email</label><input id="email" type="email" placeholder="nome@esempio.it"></div>
<div class="field"><label for="phone">Il tuo numero</label><input id="phone" type="tel" placeholder="+39 333 000 0000"></div>
<p style="font-size:15px;color:var(--muted)">Le persone da proteggere le inviti dall'app dopo l'attivazione.</p>
<label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#3A3A3C"><input type="checkbox" style="width:22px;height:22px;margin:0;flex-shrink:0"> Ho letto l'informativa privacy e i termini del servizio.</label>
<button type="submit" style="min-height:58px;border:0;border-radius:999px;background:#000;color:#fff;font:inherit;font-weight:600;font-size:19px;cursor:pointer">Continua al pagamento</button>
<div id="demo" hidden style="background:var(--soft);border-radius:16px;padding:14px 16px;font-size:15px;color:var(--muted);text-align:center">Pagina di prova: il pagamento non è ancora attivo.</div>
</form>
</div>
<script>
var P = {
  solo:   ['Vigilo Solo', '9,99 €/mese', '1 account.'],
  duo:    ['Vigilo Duo', '12,99 €/mese', '2 account: tu e una persona da proteggere.'],
  family: ['Vigilo Family', '14,99 €/mese', '4 account. +2 €/mese per account, fino a 4 in più.']
};
var k = new URLSearchParams(location.search).get('piano');
if (P[k]) {
  document.getElementById('selName').textContent = P[k][0];
  document.getElementById('selPrice').textContent = P[k][1];
  document.getElementById('selSummary').textContent = P[k][2];
}
</script>
</body>
</html>
